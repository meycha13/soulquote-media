name: Create improved Soulquote reel
on:
  push:
    paths:
      - 'scripts/reel_v2.py'
      - '.github/workflows/reel_v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/reel_v2.py
      - name: Commit improved reel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week1/friday_reel_v2.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add animated Soulquote reel with original ambient music"
            git push
          fi
