name: Approved carousel upload
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: carousel-approval-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  approved-upload:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/freigeben' &&
      contains(github.event.issue.labels.*.name, 'carousel-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Extract reviewed carousel reference
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os, re
          body=os.environ['ISSUE_BODY']
          match=re.search(r'^Carousel: ([A-Za-z0-9][A-Za-z0-9_-]{0,79})$', body, re.M)
          source=re.search(r'^Source: (public|ready)$', body, re.M)
          if not match or not source:
              raise SystemExit('Review issue must contain Carousel and Source metadata')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('CAROUSEL_SLUG='+match.group(1)+'\n')
              f.write('CAROUSEL_SOURCE='+source.group(1)+'\n')
          PY
      - name: Upload only after owner approval
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python scripts/upload_cloudinary.py
      - uses: actions/upload-artifact@v4
        with:
          name: approved-cloudinary-urls
          path: cloudinary-upload-results.json
          retention-days: 30
