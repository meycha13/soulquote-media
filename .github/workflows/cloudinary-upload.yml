name: Upload finished carousel to Cloudinary
on:
  workflow_dispatch:
    inputs:
      carousel_slug:
        description: 'Carousel filename prefix (public/) or folder name (ready/)'
        required: true
        type: string
      carousel_source:
        description: 'Choose public for existing Cinematic Science JPGs or ready for finished uploads'
        required: true
        default: public
        type: choice
        options:
          - public
          - ready
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Validate and upload five finished slides
        env:
          CAROUSEL_SLUG: ${{ inputs.carousel_slug }}
          CAROUSEL_SOURCE: ${{ inputs.carousel_source }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python scripts/upload_cloudinary.py
      - name: Save Cloudinary image URLs
        uses: actions/upload-artifact@v4
        with:
          name: cloudinary-urls
          path: cloudinary-upload-results.json
          retention-days: 7
