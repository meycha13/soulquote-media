name: Create carousel review
on:
  workflow_dispatch:
    inputs:
      carousel_slug:
        description: 'Filename prefix in public/ or folder in ready/'
        required: true
        type: string
      carousel_source:
        description: 'Image source'
        required: true
        default: public
        type: choice
        options:
          - public
          - ready
permissions:
  contents: read
  issues: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Validate images and create review issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SLUG: ${{ inputs.carousel_slug }}
          SOURCE: ${{ inputs.carousel_source }}
          REF_SHA: ${{ github.sha }}
        run: python scripts/create_carousel_review.py
