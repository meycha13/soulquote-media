name: Generate Soulquote week one
on:
  push:
    paths:
      - 'scripts/week1.py'
      - '.github/workflows/week1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/week1.py
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week1/
          if ! git diff --cached --quiet; then
            git commit -m "Generate Soulquote week one media"
            git push
          fi
