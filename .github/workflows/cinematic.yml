name: Render Cinematic Science carousels
on:
  push:
    paths:
      - 'cinematic/**.json'
      - 'assets/**'
      - 'scripts/render_cinematic.py'
      - '.github/workflows/cinematic.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cinematic-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Render cinematic manifests
        run: |
          for manifest in cinematic/*.json; do
            [ -f "$manifest" ] || continue
            python scripts/render_cinematic.py "$manifest"
          done
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m "Render Cinematic Science JPEGs"
            git pull --rebase
            git push
          fi
