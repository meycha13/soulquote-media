<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#0B1F3B"/><circle cx="870" cy="280" r="235" fill="#F38B29" opacity=".24"/><circle cx="870" cy="280" r="168" fill="none" stroke="#FF8A00" stroke-width="16" opacity=".8"/><path d="M130 300 Q350 180 600 310" stroke="#00C2C7" stroke-width="9" fill="none" opacity=".6"/><rect x="55" y="55" width="970" height="1240" rx="36" fill="none" stroke="#00C2C7" stroke-width="6"/><rect x="86" y="92" width="425" height="74" rx="13" fill="#00C2C7"/><text x="110" y="143" font-size="40" font-family="DejaVu Sans" font-weight="bold" fill="#0B1F3B">IST WIRKLICH SO?</text><text x="100" y="447" font-size="70" font-family="DejaVu Sans" font-weight="bold" fill="#F5EDE0">225 TAGE</text><rect x="80" y="500" width="920" height="162" rx="18" fill="#FFB900"/><text x="104" y="604" font-size="76" font-family="DejaVu Sans" font-weight="bold" fill="#0B1F3B">FÜR EIN JAHR</text><text x="104" y="800" fill="#F5EDE0" font-size="43" font-family="DejaVu Sans,Arial">Ein Venusjahr dauert nur etwa 225</text><text x="104" y="865" fill="#F5EDE0" font-size="43" font-family="DejaVu Sans,Arial">Erdentage: Dann hat der Planet die</text><text x="104" y="930" fill="#F5EDE0" font-size="43" font-family="DejaVu Sans,Arial">Sonne einmal umrundet. Deshalb ist</text><text x="104" y="995" fill="#F5EDE0" font-size="43" font-family="DejaVu Sans,Arial">seine Rotationsdauer tatsächlich</text><text x="104" y="1060" fill="#F5EDE0" font-size="43" font-family="DejaVu Sans,Arial">länger als sein Jahr.</text><path d="M100 1180 H980" stroke="#00C2C7" stroke-width="5"/><text x="100" y="1240" font-size="35" fill="#00C2C7" font-family="DejaVu Sans">@istwirklichso</text><text x="840" y="1240" font-size="35" fill="#F5EDE0" font-family="DejaVu Sans">03 / 05</text></svg>