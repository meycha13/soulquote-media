<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#0B1F3B"/><stop offset="1" stop-color="#073E58"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#sea)"/><circle cx="820" cy="300" r="240" fill="#00C2C7" opacity=".14"/><path d="M620 300 Q770 215 960 275 L1030 240 1000 310 1030 350 955 335 Q780 410 620 300Z" fill="#00C2C7" opacity=".7"/><path d="M790 255 L845 170 855 280" fill="#00C2C7" opacity=".7"/><path d="M75 280 Q300 220 510 300" stroke="#00C2C7" stroke-width="8" opacity=".5" fill="none"/><rect x="55" y="55" width="970" height="1240" rx="36" fill="none" stroke="#00C2C7" stroke-width="6"/><rect x="86" y="92" width="425" height="74" rx="13" fill="#00C2C7"/><text x="110" y="143" font-size="40" font-family="DejaVu Sans" font-weight="bold" fill="#0B1F3B">IST WIRKLICH SO?</text><text x="100" y="445" font-size="70" font-family="DejaVu Sans" font-weight="bold" fill="#F5EDE0">VOR ETWA</text><rect x="80" y="500" width="920" height="160" rx="18" fill="#FFB900"/><text x="104" y="604" font-size="55" font-family="DejaVu Sans" font-weight="bold" fill="#0B1F3B">450 MILLIONEN JAHREN</text><text x="102" y="796" font-size="43" fill="#F5EDE0" font-family="DejaVu Sans">Aus dieser Zeit stammen frühe</text><text x="102" y="858" font-size="43" fill="#F5EDE0" font-family="DejaVu Sans">Hinweise auf haiartige Fische.</text><text x="102" y="920" font-size="43" fill="#F5EDE0" font-family="DejaVu Sans">Viele Fossilien bestehen nur aus</text><text x="102" y="982" font-size="43" fill="#F5EDE0" font-family="DejaVu Sans">winzigen Schuppen oder Zähnen, weil</text><text x="102" y="1044" font-size="43" fill="#F5EDE0" font-family="DejaVu Sans">Knorpelskelette schlecht</text><text x="102" y="1106" font-size="43" fill="#F5EDE0" font-family="DejaVu Sans">versteinern.</text><path d="M100 1180 H980" stroke="#00C2C7" stroke-width="5"/><text x="100" y="1240" font-size="35" fill="#00C2C7" font-family="DejaVu Sans">@istwirklichso</text><text x="840" y="1240" font-size="35" fill="#F5EDE0" font-family="DejaVu Sans">02 / 05</text></svg>